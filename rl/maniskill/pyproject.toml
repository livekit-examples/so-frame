[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "soframe-rl-maniskill"
version = "0.1.0"
description = "Vision-based RL (pick a cube, place it in a bin) for the SO-101-on-frame robot, built on ManiSkill3, implementing Squint (arxiv.org/abs/2602.21203)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "mani_skill_nightly",
  "gymnasium",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "tensordict==0.7.2",
  "torchrl==0.7.2",
  "numpy",
  "tyro",
  "tqdm",
  "wandb",
  "opencv-python==4.12.0.88",
  "dacite",
  "transforms3d",
]

# train_squint.py / utils.py / examples/visualize_sim.py are plain scripts run directly
# (`uv run python train_squint.py ...`), matching Squint's own layout, not console_scripts.
# `uv sync` still installs this `src/soframe_rl_maniskill` package (the robot + task
# registration) in editable mode so those scripts can `import soframe_rl_maniskill.envs`.

[tool.uv.build-backend]
module-name = "soframe_rl_maniskill"
module-root = "src"
