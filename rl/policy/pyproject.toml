[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "soframe-policy"
version = "0.1.0"
description = "Policy networks shared by SO-101-on-frame training and deployment: vision encoders, the SAC actor, and the deploy checkpoint format. Pure torch -- no mani_skill, no livekit."
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.6.0",
  "numpy",
]

# Deliberately minimal deps. Both rl/environments/maniskill (training) and rl/deploy take this
# as a path dependency, so anything imported here is installed on the GPU box AND on the
# robot's control machine. Keep sim (mani_skill, gymnasium) and transport (livekit) out.

[tool.uv.build-backend]
module-name = "soframe_policy"
module-root = "src"

[dependency-groups]
dev = ["pytest>=8"]
