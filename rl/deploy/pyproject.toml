[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so-frame-deploy"
version = "0.1.0"
description = "Run a sim-trained RL policy on the physical SO-101-on-frame rig over LiveKit Portal."
requires-python = ">=3.12,<3.13"   # livekit-portal ships cp312 wheels only
dependencies = [
    # The encoder, actor and checkpoint format, shared with training. Pure torch -- no
    # mani_skill, so this installs on the robot host. Replaces the old arrangement where the
    # network definitions were hand-copied into policy/ and had to be kept "byte-identical".
    "soframe-policy",
    "livekit-portal>=0.2.4",
    "livekit-api>=0.7",
    # The robot side drives the SO-101 arm + cameras through lerobot; the policy side needs
    # torch + opencv + numpy for inference and camera rectification.
    "lerobot[feetech]>=0.6.0",
    # The rig is a leslider (SO-101 arm on a linear rail): one integrated 7-DOF follower over a
    # single bus, slider as a real motor -- NOT a plain 6-DOF SO101Follower + separate rail.
    "lerobot_robot_so101_slider_pos",
    "torch>=2.2",
    "opencv-python>=4.9",
    "numpy>=1.24",
    "python-dotenv>=1",
]

[dependency-groups]
# --viz only, and only ever on the operator machine. An optional group so `uv sync` on the robot
# host skips it; the lock still resolves it for linux aarch64, so the Jetson can sync either way.
viz = ["pyside6-essentials>=6.8"]

[tool.uv.sources]
soframe-policy = { path = "../policy", editable = true }
lerobot_robot_so101_slider_pos = { git = "https://github.com/pham-tuan-binh/leslider", subdirectory = "packages/lerobot_robot_so101_slider_pos", rev = "c18e50fed2eb8e4343de40a3e90cbb10eb885e04" }

[project.scripts]
robot = "robot.run:cli"
policy = "policy.run:cli"

# The project has to be packaged for `uv run robot` / `uv run policy` to exist:
# with `package = false` uv skips installing project.scripts entirely (it says so
# in a warning during sync) and the documented commands do not resolve.
[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["robot", "policy", "utils"]
