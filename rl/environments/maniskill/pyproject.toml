[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "soframe-rl-maniskill"
version = "0.1.0"
description = "Vision-based RL (pick a cube, place it in a bin) for the SO-101-on-frame robot, built on ManiSkill3, implementing Squint (arxiv.org/abs/2602.21203)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "soframe-policy",
  "mani_skill==3.0.1",
  "gymnasium",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "tensordict==0.7.2",
  "torchrl==0.7.2",
  "numpy",
  "tyro",
  "tqdm",
  "wandb",
  "opencv-python==4.12.0.88",
  "dacite",
  "transforms3d",
]

# mani_skill is pinned to the released 3.0.1 rather than mani_skill_nightly, which is what this
# tree inherited from Squint's dependency list. Nothing here needs post-3.0.1 ManiSkill: every
# symbol this package imports exists in 3.0.1, and SimConfig / SceneConfig / CameraConfig carry
# the same fields, so the nightlies only added a pyright annotation sweep on top. A fixed release
# also matches what third-party backends validate against -- the AMD/HIP PhysX port
# (github.com/pham-tuan-binh/ManiSkill, tools/amd_port) is validated on 3.0.1 + sapien 3.0.3.

# train.py / examples/*.py are plain scripts run directly (`uv run python train.py ...`),
# matching Squint's own layout, not console_scripts. `uv sync` still installs this
# `src/soframe_rl_maniskill` package (the robot, task registration, SAC, obs wrappers) in
# editable mode so those scripts can `import soframe_rl_maniskill.envs`.

# The encoder/actor definitions and the checkpoint format are shared with the deploy tree
# (rl/deploy), so both take the same package as a path dependency. Anything a checkpoint
# contains is defined once, in policy/, rather than hand-copied per tree.
[tool.uv.sources]
soframe-policy = { path = "../../policy", editable = true }

[tool.uv.build-backend]
module-name = "soframe_rl_maniskill"
module-root = "src"
