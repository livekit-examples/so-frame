[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "soframe-rl-maniskill"
version = "0.1.0"
description = "Vision-based RL (pick a cube, place it in a bin) for the SO-101-on-frame robot, built on ManiSkill3, implementing Squint (arxiv.org/abs/2602.21203)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "soframe-policy",
  "mani_skill==3.0.1",
  "gymnasium",
  # >=2.10 is the ROCm alignment requirement, and it is the whole reason for the pins below.
  #
  # The AMD box runs system ROCm 7.2.1, and the port's libPhysXGpu_64.so / SAPIEN are built
  # against it. PyTorch published NO ROCm 7 wheels until torch 2.10 -- the indexes are
  # rocm6.2 (torch 2.5), rocm6.3 (2.7-2.9), rocm6.4 (2.8-2.9), rocm7.0 (2.10), rocm7.1 (2.10+).
  # So any torch below 2.10 necessarily puts a ROCm 6 runtime in a ROCm 7 process, and the two
  # cannot coexist:
  #
  #   * torch's bundled libamdhip64.so has SONAME libamdhip64.so.6; the system one is .so.7.
  #   * Leave torch's ROCm 6 libraries in place and SAPIEN dies with
  #     `undefined symbol: hsa_amd_memory_get_preferred_copy_engine, version ROCR_1` --
  #     ROCm 6's libhsa-runtime64 cannot serve the system's libamdhip64.so.7.
  #   * Move them aside (the port's --fix-torch-rocm, pitfall P10) and SAPIEN works, but now
  #     nothing provides libamdhip64.so.6, so torchvision's _C.so will not dlopen and
  #     `import torchvision` fails with `operator torchvision::nms does not exist`.
  #
  # All five subsets of that move were tested: there is no middle ground. On a ROCm 6 wheel with
  # system ROCm 7, GPU physics and torchvision's C++ ops are mutually exclusive -- which means
  # train.py cannot import.
  #
  # Matching the ROCm MAJOR resolves that: both sides become .so.7, so torchvision loads. cp310
  # wheels exist on rocm7.1 for torch 2.10-2.13, so this stays on Python 3.10, no interpreter
  # change, and the port's pysapien.cpython-310 still applies.
  #
  # BUT MATCHING MAJORS DOES NOT REMOVE THE NEED FOR --fix-torch-rocm, which is the opposite of
  # what an earlier version of this comment claimed. torch still SHIPS its own libamdhip64.so with
  # SONAME libamdhip64.so.7, and the system has one too. Two copies of the same soname in one
  # process makes HIP abort:
  #
  #   F hip.cpp:512] hipApiName has non-null function pointer 1 despite this being the first
  #                  instance of the library being copies
  #
  # observed as a hard abort during scene reconfiguration. What matching the majors actually buys
  # is that --fix-torch-rocm becomes SAFE for torchvision: once torch's copies are moved aside, the
  # system's .so.7 satisfies the soname torchvision's _C.so needs. On a ROCm 6 wheel it could not.
  # So the rule is: match the major AND apply the fix.
  # Pinned exactly, and the exact value is load-bearing in a way that is easy to get wrong.
  #
  # torchrl X.Y is COMPILED against a specific torch, and the pairing is torchrl 0.N <-> torch
  # 2.(N-1). That is why torchrl 0.7.2 declares torch>=2.6.0. So torchrl 0.13.x wants torch 2.12,
  # NOT the newest wheel on the index. Pairing 0.13.3 with torch 2.13.0 fails like this:
  #
  #   torchrl/_torchrl.cpython-310-x86_64-linux-gnu.so:
  #     undefined symbol: _ZN5torch8autograd10deleteNodeEPNS0_4NodeE
  #
  # and torchrl CATCHES that ImportError and degrades quietly. Rollout collection then runs fine
  # for thousands of steps and the process SEGFAULTS at the first gradient update, when the replay
  # buffer first touches the C++ path. The crash tracks --learning-starts exactly, which is the
  # tell: with 500 it dies at step 496, with 2000 at step 1984.
  #
  # Also practical: download.pytorch.org serves no PEP 658 metadata (the .metadata sidecar 403s),
  # so uv reads each CANDIDATE wheel over the network to learn its dependencies, and these wheels
  # are ~5.5 GB. A five-version range turns `uv lock` into a multi-gigabyte operation that ran past
  # 15 minutes without finishing; one exact version resolved 109 packages in 4.65 seconds.
  #
  # Bump torch and torchrl together, deliberately, and check the extension actually loads:
  #   python -c "import torchrl._torchrl"      # must not raise
  "torch==2.12.1",
  "torchvision==0.27.1",
  # AMD: torch pulls Triton from the ROCm index, and uv only maps DIRECT dependencies to an index,
  # so it must be named here or it is looked for on PyPI, where it does not exist.
  #
  # NOTE THE NAME. torch renamed this dependency between 2.7 and 2.13: it was
  # `pytorch-triton-rocm`, it is now `triton-rocm`. Keeping the old name produces a resolution
  # error that names the NEW one and reads like a missing package rather than a rename:
  #   Because there is no version of triton-rocm==3.7.1 and torch>=2.13.0+rocm7.1 depends on
  #   triton-rocm==3.7.1, we can conclude that torch>=2.13.0+rocm7.1 cannot be used.
  # If you move back to a torch 2.7-2.9 wheel, this goes back to `pytorch-triton-rocm`.
  "triton-rocm ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Moved from 0.7.2 to track torch >=2.10. 0.7.2's compiled extensions target torch 2.7 and warn
  # `Failed to import torchrl C++ binaries` against anything newer. The API surface this package
  # actually uses is small and long-stable across that range -- TensorDict, from_module,
  # from_modules, tensordict.nn.CudaGraphModule, torchrl.data.LazyTensorStorage and ReplayBuffer --
  # which is why the version jump is a pin change rather than a migration.
  "tensordict>=0.13,<0.14",
  "torchrl>=0.13,<0.14",
  "numpy",
  "tyro",
  "tqdm",
  "wandb",
  "opencv-python==4.12.0.88",
  "dacite",
  "transforms3d",
]

# mani_skill is pinned to the released 3.0.1 rather than mani_skill_nightly, which is what this
# tree inherited from Squint's dependency list. Nothing here needs post-3.0.1 ManiSkill: every
# symbol this package imports exists in 3.0.1, and SimConfig / SceneConfig / CameraConfig carry
# the same fields, so the nightlies only added a pyright annotation sweep on top. A fixed release
# also matches what third-party backends validate against -- the AMD/HIP PhysX port
# (github.com/pham-tuan-binh/ManiSkill, tools/amd_port) is validated on 3.0.1 + sapien 3.0.3.

# train.py / examples/*.py are plain scripts run directly (`uv run python train.py ...`),
# matching Squint's own layout, not console_scripts. `uv sync` still installs this
# `src/soframe_rl_maniskill` package (the robot, task registration, SAC, obs wrappers) in
# editable mode so those scripts can `import soframe_rl_maniskill.envs`.

# The encoder/actor definitions and the checkpoint format are shared with the deploy tree
# (rl/deploy), so both take the same package as a path dependency. Anything a checkpoint
# contains is defined once, in policy/, rather than hand-copied per tree.
# --- AMD / ROCm -------------------------------------------------------------------------------
# This branch runs on AMD RDNA3 (gfx1100) via the ManiSkill AMD port. See the ManiSkill repo's
# tools/amd_port/REPRODUCE.md; the short version is:
#
#     uv sync
#     /path/to/ManiSkill/tools/amd_port/install-into.sh .venv --fix-torch-rocm
#     uv run python train.py
#
# --fix-torch-rocm is REQUIRED, on an aligned stack as much as a mismatched one: torch ships its own
# libamdhip64.so.7 and so does the system, and two copies of one soname make HIP abort. See the
# torch pin above. No LD_LIBRARY_PATH step is needed, though: the port's libraries carry an $ORIGIN
# rpath, so nothing has to be exported at runtime.
#
# The port lives in PhysX and SAPIEN, not in ManiSkill, so mani_skill stays the unmodified 3.0.1
# release from PyPI -- there is no fork to track.
#
# torch must come from the ROCm index, and the index must match the SYSTEM ROCm major -- rocm7.1
# for ROCm 7.x. Using a rocm6.x index on a ROCm 7 machine makes GPU physics and torchvision
# mutually exclusive; the torch pin above explains exactly why. If you are on system ROCm 6.x,
# point these at rocm6.3 instead and pin torch accordingly.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-rocm71"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm71" }
torchvision = { index = "pytorch-rocm71" }
# triton-rocm, not pytorch-triton-rocm -- torch renamed it; see the dependency list above.
triton-rocm = { index = "pytorch-rocm71" }
soframe-policy = { path = "../../policy", editable = true }

[tool.uv.build-backend]
module-name = "soframe_rl_maniskill"
module-root = "src"
